# MC AuthPro 消息配置文件
# 所有玩家可见的文字均可在此修改
# 支持颜色代码：§0-§f 或 &0-&f

# ========== 通用 ==========
no-permission: "&c你没有权限执行此命令。"
player-only: "&c此命令只能由玩家执行。"

# ========== 加入服务器 ==========
join-welcome: "&a欢迎回来，{player}！"
join-registered-prompt: "&e请执行：/login <密码>"
join-unregistered-prompt: "&e请执行：/reg <密码> <密码>"

# ========== 人机验证 ==========
verify-url-message: |
  &e=== 人机验证 ===
  &f请在浏览器中打开以下链接完成验证：
  &b{url}
  &f复制令牌后执行：/verify <令牌>
  &c请在 {seconds} 秒内完成，否则将被踢出！
verify-title: "&e人机验证"
verify-subtitle: "&f请在 &c{seconds} &f秒内完成验证"
verify-timeout: "&c人机验证超时，请重新加入"
verify-no-session: "&c未找到验证会话，请重新加入服务器。"
verify-usage: "&c用法：/verify <令牌>"
verify-already-done: "&e你已完成人机验证。"
verify-failed: "&c验证失败，令牌无效或已过期。"

# ========== 验证通过 ==========
verify-success-title: "&a验证通过"
verify-registered-prompt: "&f请通过 /login 登陆"
verify-unregistered-prompt: "&f请通过 /reg 注册"
verify-success-registered: |
  &e=== 人机验证通过 ===
  &f已注册玩家请执行：/login <密码>
  &f未注册玩家请执行：/reg <密码> <密码>
verify-success-unregistered: |
  &e=== 人机验证通过 ===
  &f请执行：/reg <密码> <密码> 注册账号

# ========== 登录 ==========
login-usage: "&c用法：/login <密码>"
login-already-logged-in: "&e你已登录。"
login-not-registered: "&c你未注册，请先执行：/reg <密码> <密码>"
login-not-verified: "&c请先完成人机验证：/verify <令牌>"
login-success: "&a登录成功！欢迎回来，{player}！"
login-success-title: "&a登录成功"
login-success-subtitle: "&f欢迎回来，{player}！"
login-failed: "&c密码错误，请重试。"
login-failed-kick: "&c密码错误，请重新加入并重试"

# ========== 注册 ==========
register-usage: "&c用法：/reg <密码> <密码>"
register-already-logged-in: "&e你已登录。"
register-already-registered: "&c你已注册，请执行：/login <密码>"
